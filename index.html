<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>촬영용 화면 소품</title>
  <style>
    :root { --ink: #1a1d29; --ink-2: #5b6070; --line: #e3e5ec; --bg: #f6f7fa; --accent: #4f46e5; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.6 -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
    main { max-width: 760px; margin: 0 auto; padding: 48px 16px; }
    h1 { margin: 0 0 4px; font-size: 26px; letter-spacing: -.5px; }
    p.sub { margin: 0 0 28px; color: var(--ink-2); }
    ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
    li a { display: grid; grid-template-columns: 64px 1fr auto; gap: 14px; align-items: center; background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; color: inherit; text-decoration: none; }
    li a:hover { border-color: var(--accent); }
    .scene { font-weight: 800; color: var(--accent); font-variant-numeric: tabular-nums; }
    .t { font-weight: 700; }
    .d { display: block; font-size: 13px; color: var(--ink-2); }
    .dev { font-size: 12px; color: var(--ink-2); border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; white-space: nowrap; }
    h2 { font-size: 15px; margin: 32px 0 10px; color: var(--ink-2); }
  </style>
</head>
<body>
<main>
  <h1>촬영용 화면 소품</h1>
  <p class="sub">촬영에 쓰는 가짜 화면 모음. 등장하는 기관·언론사·이름은 모두 허구입니다.</p>
  <ul>
    <li><a href="contest/index.html?cat=art"><span class="scene">S#2</span><span><span class="t">모아콘 공모전 사이트</span><span class="d">청소년 미술 공모전 목록 → 대상 45만 / 90만 / 180만 원 상세</span></span><span class="dev">맥북</span></a></li>
    <li><a href="contest/detail.html?id=3"><span class="scene">S#2</span><span><span class="t">└ 대상 180만 원 공모전 (즐겨찾기)</span><span class="d">주제: 현대사회 속 인간성의 회복</span></span><span class="dev">맥북</span></a></li>
    <li><a href="portal/index.html"><span class="scene">S#3</span><span><span class="t">포털 검색 → 뉴스 기사 → 댓글</span><span class="d">'지다람' 검색 → 공모전 17관왕 기사 → 댓글 13개</span></span><span class="dev">휴대폰</span></a></li>
    <li><a href="portal/comments.html"><span class="scene">S#3</span><span><span class="t">└ 댓글 화면 바로 열기</span><span class="d">캡처 후 자르기 연출용</span></span><span class="dev">휴대폰</span></a></li>
  </ul>
</main>
</body>
</html>
